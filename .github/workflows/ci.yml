name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths: ["core/**", "web/**", "eval/**", "corpus/index/**"]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npx tsc -p tsconfig.app.json --noEmit && npm run build
  core-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<2.6" && pip install -r core/requirements.txt
      - run: python -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('core/app', quiet=1) else 1)"
      - name: Tests
        run: pip install pytest && python -m pytest
      - name: RAG eval gate
        run: python eval/run_eval.py
  image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64     # arm64 for Oracle A1, amd64 for the HF Space standby
          push: true
          tags: ghcr.io/${{ github.repository }}/core:latest
