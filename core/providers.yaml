# LLM providers, all spoken to through their OpenAI-compatible chat endpoint.
# A provider is active only when the env var named in key_env is set.
#
# Limits are FREE-TIER numbers as of mid-2026 — re-verify each before launch and
# whenever an alert fires. The router keeps 20% headroom under every window.
#   rpm/rpd = requests per minute/day, tpm/tpd = tokens per minute/day (0 = no limit)
#   tier: A = best quality (preferred for Arabic), B = bulk/overflow
#   langs: languages this provider is preferred for (others still allowed)

providers:
  - id: gemini-flash-lite
    key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash-lite
    tier: A
    langs: [ar, en, fr]
    rpm: 15
    rpd: 1000
    tpm: 250000
    tpd: 0
    concurrency: 4

  - id: cerebras-llama70b
    key_env: CEREBRAS_API_KEY
    base_url: https://api.cerebras.ai/v1
    model: llama-3.3-70b
    tier: A
    langs: [ar, en, fr]
    rpm: 30
    rpd: 14400
    tpm: 60000
    tpd: 1000000
    concurrency: 4

  - id: groq-llama70b
    key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    tier: A
    langs: [ar, en, fr]
    rpm: 30
    rpd: 1000
    tpm: 12000
    tpd: 100000
    concurrency: 3

  - id: groq-llama8b
    key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    model: llama-3.1-8b-instant
    tier: B
    langs: [en, fr]
    rpm: 30
    rpd: 14400
    tpm: 6000
    tpd: 500000
    concurrency: 3

  - id: mistral-small
    key_env: MISTRAL_API_KEY
    base_url: https://api.mistral.ai/v1
    model: mistral-small-latest
    tier: B
    langs: [en, fr, ar]
    rpm: 60          # Experiment tier is 1 req/s
    rpd: 0
    tpm: 500000
    tpd: 33000000    # 1B tokens/month
    concurrency: 2

  - id: openrouter-free
    key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: meta-llama/llama-3.3-70b-instruct:free
    tier: B
    langs: [en, fr, ar]
    rpm: 20
    rpd: 50
    tpm: 0
    tpd: 0
    concurrency: 2

  - id: cloudflare-workers-ai
    key_env: CLOUDFLARE_API_TOKEN
    base_url_template: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    model: "@cf/meta/llama-3.1-8b-instruct-fast"
    tier: B
    langs: [en, fr]
    rpm: 30
    rpd: 600         # ≈ 10k neurons/day at ~15 neurons per RAG call
    tpm: 0
    tpd: 0
    concurrency: 2
