# LLM providers, all spoken to through their OpenAI-compatible chat endpoint.
# A provider is active only when the env var named in key_env is set.
#
# Limits are FREE-TIER numbers as of mid-2026 — re-verify each before launch and
# whenever an alert fires. The router keeps 20% headroom under every window.
#   rpm/rpd = requests per minute/day, tpm/tpd = tokens per minute/day (0 = no limit)
#   tier: A = best quality (preferred for Arabic), B = bulk/overflow
#   langs: languages this provider is preferred for (others still allowed)

providers:
  # Local model server — no API key, no rate limit, no daily cap, nothing leaves the machine.
  # `priority` outranks every cloud lane, so the keyed providers below are only ever reached
  # when this one is down or saturated. base_url/model/concurrency come from LOCAL_LLM_* in
  # core/.env; set LOCAL_LLM_ENABLED=false to drop it entirely.
  # reasoning_effort=none is required for Qwen3: otherwise it spends the whole max_tokens
  # budget on its <think> pass and streams back empty content.
  - id: local-qwen
    local: true
    base_url: http://localhost:11434/v1
    model: qwen3:8b
    tier: A
    priority: 1
    langs: [ar, en, fr]
    rpm: 0
    rpd: 0
    tpm: 0
    tpd: 0
    concurrency: 2
    extra_body:
      reasoning_effort: none

  - id: gemini-flash-lite
    key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash-lite
    tier: A
    langs: [ar, en, fr]
    rpm: 15
    rpd: 1000
    tpm: 250000
    tpd: 0
    concurrency: 4

  - id: cerebras-llama70b
    key_env: CEREBRAS_API_KEY
    base_url: https://api.cerebras.ai/v1
    model: llama-3.3-70b
    tier: A
    langs: [ar, en, fr]
    rpm: 30
    rpd: 14400
    tpm: 60000
    tpd: 1000000
    concurrency: 4

  # llama-3.3-70b-versatile / llama-3.1-8b-instant, previously configured here, were
  # retired from Groq's catalog (confirmed via GET /v1/models against a real key — this
  # is exactly the "free-tier numbers are the most volatile input" risk the top of this
  # file warns about). gpt-oss needs reasoning_effort set or it burns the whole token
  # budget on hidden reasoning and returns empty content, same failure mode as Qwen3.
  - id: groq-gptoss120b
    key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    tier: A
    langs: [ar, en, fr]
    rpm: 30
    rpd: 1000
    tpm: 12000
    tpd: 100000
    concurrency: 3
    extra_body:
      reasoning_effort: low

  - id: groq-gptoss20b
    key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b
    tier: B
    langs: [en, fr]
    rpm: 30
    rpd: 14400
    tpm: 6000
    tpd: 500000
    concurrency: 3
    extra_body:
      reasoning_effort: low

  - id: mistral-small
    key_env: MISTRAL_API_KEY
    base_url: https://api.mistral.ai/v1
    model: mistral-small-latest
    tier: B
    langs: [en, fr, ar]
    rpm: 60          # Experiment tier is 1 req/s
    rpd: 0
    tpm: 500000
    tpd: 33000000    # 1B tokens/month
    concurrency: 2

  - id: openrouter-free
    key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: meta-llama/llama-3.3-70b-instruct:free
    tier: B
    langs: [en, fr, ar]
    rpm: 20
    rpd: 50
    tpm: 0
    tpd: 0
    concurrency: 2

  - id: cloudflare-workers-ai
    key_env: CLOUDFLARE_API_TOKEN
    base_url_template: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    model: "@cf/meta/llama-3.1-8b-instruct-fast"
    tier: B
    langs: [en, fr]
    rpm: 30
    rpd: 600         # ≈ 10k neurons/day at ~15 neurons per RAG call
    tpm: 0
    tpd: 0
    concurrency: 2
