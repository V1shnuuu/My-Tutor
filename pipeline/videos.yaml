# Course video registry, read by `python pipeline/ingest.py`.
#
# Empty on purpose. The MIT 6.006 sample lectures that used to sit here were removed once
# the course had its own videos — the Tutor now answers only from what an admin connects in
# the dashboard, which ingests through core/app/course_ingest.py and writes the same
# corpus/index + corpus/transcripts shards this file's pipeline does.
#
# This lane is still the way to add a video that isn't coming from YouTube (a local file, a
# lecture capture) or to re-ingest in bulk without the dashboard. Add entries like:
#
#   videos:
#     - id: week1-lecture1          # becomes the corpus video id; keep it stable
#       title: "Week 1 — Introduction"
#       source: youtube             # or: local
#       youtube_id: dQw4w9WgXcQ     # or: path: /abs/path/to/lecture.mp4
#       transcript: auto            # auto = YouTube captions, whisper = transcribe locally
#       lang: ar                    # ar | en | fr
#       week: 1
#
# then run `python pipeline/add_videos.py <folder> --dry-run && python pipeline/ingest.py`
# and commit the resulting corpus/ shards.
videos: []
